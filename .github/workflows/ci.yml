name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow dispatches CI for release PRs, which pull_request
  # never sees because GITHUB_TOKEN pushes their commits.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is where most users run this; ubuntu-latest ships tmux 3.4.
        # The floor job below covers 3.2a and 3.3a.
        os: [ubuntu-latest, macos-latest]
        go: ['1.26', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
          tmux -V
      - run: go vet ./...
      - name: test (unit, fixture replay, integration on private tmux servers)
        run: go test -race ./...
        env:
          YTTA_LEAK_WORDS: ${{ secrets.YTTA_LEAK_WORDS }}
      - run: make build && ./bin/ytta --version

  floor:
    # The oldest tmux the plugin supports, and the first one with a styled
    # popup. Distribution images pin both: nothing else ships them any more.
    name: tmux ${{ matrix.tmux }} (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            tmux: 3.2a
          - image: debian:bookworm
            tmux: 3.3a
    env:
      # Without a UTF-8 locale tmux prints every glyph as "_".
      LC_ALL: C.UTF-8
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: install tmux and a toolchain
        run: |
          apt-get update
          apt-get install -y tmux git ca-certificates curl gcc libc6-dev bsdutils
          test "$(tmux -V)" = "tmux ${{ matrix.tmux }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
        env:
          GOFLAGS: -buildvcs=false

  perf:
    name: performance at scale (120 panes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - name: make perf
        run: make perf
        env:
          # Shared runners have a noisy tail: gate on the median, with slack.
          # The p95 budgets in test/integration/perf_test.go hold on a laptop.
          YTTA_PERF_TAIL: "off"
          YTTA_PERF_SLACK: "4"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1

  checks:
    name: shellcheck, tidy, goreleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: shellcheck
        run: shellcheck ytta.tmux scripts/*.sh
      - name: go.mod and go.sum are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check
