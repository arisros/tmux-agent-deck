name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS matters: BSD ps/stat/sed differ, and that is where this runs.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
          tmux -V
      - run: go vet ./...
      - name: test (unit, integration on a private tmux server, performance at scale)
        run: go test -race ./...
        env:
          # Shared runners are slower and noisier than a laptop; the local
          # budgets in test/integration/perf_test.go are the real targets.
          DECK_PERF_HOOK_MS: "60"
          DECK_PERF_EDGE_MS: "100"
          DECK_PERF_VIEW_MS: "300"
      - run: make build && ./bin/deck version && ./bin/deck describe | head -3

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10
