# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: ytta

builds:
  - id: ytta
    main: ./cmd/ytta
    binary: ytta
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}

# ytta.tmux downloads ytta_<version>_<os>_<arch>.tar.gz and
# verifies it against checksums.txt; keep both names in step with it.
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# release-please writes the notes; GoReleaser only attaches the files.
changelog:
  disable: true

release:
  prerelease: auto
  mode: keep-existing
